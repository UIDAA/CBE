server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/onboarding}
    username: ${DB_USERNAME:onboarding}
    password: ${DB_PASSWORD:onboarding}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE

app:
  time-zone: Asia/Seoul
  jwt:
    # 운영에서는 반드시 JWT_SECRET 환경변수로 32바이트 이상 값을 주입한다.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    access-ttl-seconds: 1800
    refresh-ttl-days: 14
